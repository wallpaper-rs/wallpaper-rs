name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      informational: ${{ steps.gitversion.outputs.informationalVersion }}
      rust: ${{ steps.changes.outputs.rust }}
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conventional Commits and commit dates
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          kept() { grep -vFf <(sed -n 's/^ *- \([0-9a-f]\{40\}\)$/\1/p' GitVersion.yml); }
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=$(git merge-base origin/master HEAD)
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "$BASE")
          bad=$(git log --no-merges --format='%H %s' "$BASE..HEAD" | kept |
            grep -Ev '^\S+ (build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()]+\))?!?: \S' || true)
          [ -z "$bad" ] || { echo "$bad"; echo "::error::These subjects do not follow Conventional Commits"; exit 1; }
          newest=$(git log --format='%ct %H' HEAD^@ | kept | sort -n | tail -1)
          [ "$(git log -1 --format=%ct)" -gt "${newest%% *}" ] || { echo "::error::HEAD needs a later commit date than ${newest#* }"; exit 1; }

      - uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f
        with:
          versionSpec: 6.8.2

      - id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f

      - id: changes
        name: Jobs that a change can affect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ALWAYS: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
        run: scripts/changes.sh "$BASE" "$ALWAYS" | tee -a "$GITHUB_OUTPUT"

      - name: GitVersion versioned HEAD
        env:
          SHA: ${{ steps.gitversion.outputs.sha }}
        run: test "$SHA" = "$(git rev-parse HEAD)"

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: actionlint with shellcheck
        run: |
          shellcheck --version | grep '^version'
          "$(scripts/tools.sh actionlint "$RUNNER_TEMP/tools")" -color

  lint:
    name: Static checks
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: scripts/ci-apt.sh shellcheck qt6-declarative-dev-tools gettext

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: File lengths
        run: scripts/file-lengths.sh

      - name: Every workspace package is in a test shard
        run: scripts/test-shards.sh check

      - name: Shell scripts
        run: shellcheck apps/wprs-server/skeleton.sh packaging/*.sh packaging/flatpak/*.sh scripts/*.sh

      - name: QML syntax
        run: |
          for f in integrations/*/metadata.json; do python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f"; done
          for f in integrations/*/contents/ui/*.qml apps/wprs-app/qml/*.qml apps/wprs-app/qml/*/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$f" > /dev/null
          done

      - name: Translations
        run: scripts/translations.sh check

  clippy:
    name: Clippy
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools gettext

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Unit and render tests (shard ${{ matrix.shard }})
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire gstreamer1.0-tools \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 gnome-keyring \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools gettext

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: test-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Unit and render tests
        env:
          WPRS_REQUIRE_GPU: "1"
          WPRS_REQUIRE_VIDEO: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t packages < <(scripts/test-shards.sh "$SHARD")
          cargo test "${packages[@]}" --all-features --locked

  render-gl:
    name: Render tests on OpenGL ES
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libegl1 libgles2 libgl1-mesa-dri

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: test-1
          save-if: false

      - name: Render tests with the OpenGL ES backend
        env:
          WGPU_BACKEND: gl
          LIBGL_ALWAYS_SOFTWARE: "1"
          WPRS_REQUIRE_GPU: "1"
        run: |
          cargo test -p wprs-render --all-features --locked -- \
            --skip a_directional_light_with_shadows_darkens_the_ground_behind_a_block \
            --skip scenes_that_blend_in_srgb_draw_no_more_passes_than_linear_ones \
            --skip a_shader_that_breaks_the_device_is_blamed_and_nothing_panics

  depth:
    name: Depth model test
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            mesa-vulkan-drivers libvulkan1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: dev
          save-if: false

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.local/share/wallpaper-rs/models
            ~/.local/share/wallpaper-rs/runtime
          key: depth-anything-v2-small-46c4e8ee-onnxruntime-1.31.0

      - name: Depth model test
        run: |
          cargo build --locked -p wprs-ctl
          target/debug/wprs-ctl models download depth-anything-v2-small --yes
          target/debug/wprs-ctl models download onnxruntime --yes
          WPRS_DEPTH_MODEL=$HOME/.local/share/wallpaper-rs/models/depth-anything-v2-small/depth_anything_v2_vits_dynamic.onnx \
            cargo test --locked -p wprs-depth --all-features --test model -- --nocapture

      - name: Scene examples of the creator documentation
        run: |
          cargo build --locked -p wprs-ctl
          scripts/docs-examples.sh target/debug

  e2e:
    name: End-to-end test (D-Bus + PipeWire + daemon)
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire gstreamer1.0-tools \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 gnome-keyring

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: User namespaces for the sandbox stand-in
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end test (D-Bus + PipeWire + daemon)
        run: |
          cargo build --locked -p wprsd -p wprs-ctl -p wprs-web
          cargo build --locked -p wprs-pipewire --example probe
          cargo build --locked -p wprsd --examples
          cp target/debug/examples/probe target/debug/probe
          scripts/integration-test.sh target/debug

  web:
    name: Web wallpapers
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: dev
          save-if: false

      - name: Daemon, helper and test binaries
        run: |
          cargo build --locked -p wprsd -p wprs-ctl -p wprs-web
          cargo build --locked -p wprs-pipewire --example probe
          page=$(cargo test --locked -p wprs-web --test page --no-run --message-format=json |
            jq -r 'select(.executable != null and .target.name == "page") | .executable')
          cp "$page" target/debug/web-page
          cp target/debug/examples/probe target/debug/probe

      - name: Virtual DRM devices
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci-drm.sh

      - name: User namespaces for the WebKit sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Helper and daemon with WPE WebKit, and video sound through PipeWire 1.2 or newer
        run: |
          docker run --rm --device /dev/dri --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -v "$PWD:$PWD" -w "$PWD" \
            docker.io/library/archlinux:base-20261018.0.612668@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0 bash -c '
            set -e
            pacman -Sy --noconfirm --needed archlinux-keyring >/dev/null
            pacman -Syu --noconfirm --needed wpewebkit pipewire pipewire-audio gst-plugin-pipewire wireplumber dbus python procps-ng \
              gst-plugins-base gst-plugins-good mesa vulkan-swrast vulkan-icd-loader >/dev/null
            pacman -Q wpewebkit gst-plugin-pipewire
            useradd -m -u "$(stat -c %u .)" tester
            su tester -c "WPRS_REQUIRE_WEB=1 target/debug/web-page --test-threads 1 && WPRS_REQUIRE_WEB=1 scripts/web-test.sh target/debug && WPRS_REQUIRE_PIPEWIRE_SOUND=1 scripts/video-test.sh target/debug"
          '

  sway:
    name: Sway end-to-end
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 \
            sway grim foot fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: dev
          save-if: false

      - name: Layer-shell surfaces on a headless Sway
        run: |
          cargo build --locked -p wprsd -p wprs-ctl --bins --example pointer
          scripts/sway-test.sh target/debug

  x11:
    name: X11 end-to-end
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 \
            xvfb x11-utils x11-xserver-utils xdotool imagemagick openbox

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: dev
          save-if: false

      - name: Desktop windows on Xvfb
        run: |
          cargo build --locked -p wprsd -p wprs-ctl
          scripts/x11-test.sh target/debug

  sync:
    name: Server sync end-to-end
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 gnome-keyring

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Daemons, the phone client and wprs-server with end-to-end encrypted sync
        run: |
          cargo build --locked -p wprsd -p wprs-ctl -p wprs-server
          cargo build --locked -p wprs-android --example phone
          cp target/debug/examples/phone target/debug/phone
          scripts/sync-test.sh target/debug

  build:
    name: Release binaries (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - name: daemon
            bins: wprsd
            cache: daemon
            save: true
            files: |
              target/release/wprsd
          - name: app
            bins: wprs-app
            cache: app
            save: true
            files: |
              target/release/wprs-app
          - name: tools
            bins: wprs-ctl wprs-web
            cache: daemon
            save: false
            files: |
              target/release/wprs-ctl
              target/release/wprs-web
    env:
      WPRS_VERSION: ${{ needs.version.outputs.informational }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - id: apt
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ github.job }}-

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools ccache

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: github.ref == 'refs/heads/master' && steps.apt.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: release-${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.save }}

      - id: ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        if: matrix.name == 'app'
        with:
          path: ~/.cache/ccache
          key: ccache-app-${{ hashFiles('Cargo.lock', 'apps/wprs-app/qml/**', 'apps/wprs-app/qt-shim/**', 'apps/wprs-app/src/**', 'po/**') }}
          restore-keys: ccache-app-

      - name: Compiler cache
        if: matrix.name == 'app'
        run: |
          {
            echo "CC=ccache gcc"
            echo "CXX=ccache g++"
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPRESS=1"
            echo "CCACHE_MAXSIZE=600M"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          BINARIES: ${{ matrix.bins }}
        run: |
          read -ra bins <<< "$BINARIES"
          scripts/build-release.sh "${bins[@]}"
          if command -v ccache > /dev/null && [ -n "${CCACHE_DIR:-}" ]; then ccache --show-stats; fi

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: matrix.name == 'app' && github.ref == 'refs/heads/master' && steps.ccache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccache
          key: ccache-app-${{ hashFiles('Cargo.lock', 'apps/wprs-app/qml/**', 'apps/wprs-app/qt-shim/**', 'apps/wprs-app/src/**', 'po/**') }}

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: build-timings-${{ matrix.name }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-bin-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  package:
    name: Package
    needs: [version, build]
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      WPRS_VERSION: ${{ needs.version.outputs.informational }}
      WPRS_BIN_DIR: ${{ github.workspace }}/bins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            libpipewire-0.3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gettext

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-bin-*
          path: bins
          merge-multiple: true

      - name: Build tarball
        run: scripts/package.sh dist

      - name: Packages carry no build machine data
        run: |
          tar -xzf "dist/wallpaper-rs-${WPRS_VERSION%%+*}-x86_64-linux.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/wallpaper-rs-${WPRS_VERSION%%+*}-x86_64-linux/bin/wprs-ctl" --version)" = "wprs-ctl $WPRS_VERSION"
          for p in plasma-wallpaper plasma-tray kwin-pointer; do
            grep -qF "\"Version\": \"${WPRS_VERSION%%+*}\"" "$RUNNER_TEMP"/wallpaper-rs-*/$p/metadata.json
          done
          bins=("$RUNNER_TEMP"/wallpaper-rs-*/bin/*)
          if strings "${bins[@]}" | grep -F -e "$HOME" -e "$GITHUB_WORKSPACE" -e "$USER@"; then exit 1; fi
          if strings "${bins[@]}" | grep -E '/(home|root)/'; then exit 1; fi
          if readelf -p .comment "${bins[@]}" 2>/dev/null | grep -q '\['; then exit 1; fi
          tar --numeric-owner -tvzf dist/*.tar.gz | awk '$2 != "0/0" {bad = 1} END {exit bad}'
          python3 -c 'import sys; h = open(sys.argv[1], "rb").read(8); sys.exit(h[3] & 8 or h[4:8] != bytes(4))' dist/*.tar.gz

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  android-native:
    name: Android native library (${{ matrix.abi }})
    needs: version
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    env:
      ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ${{ matrix.abi }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk --version 4.1.2

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
          cache-read-only: true
          add-job-summary: on-failure

      - name: Release library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          android/gradlew -p android :app:cargo -Pabis="$ABI"
          ls -l "android/app/build/rustJniLibs/$ABI"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: jni-${{ matrix.abi }}
          path: android/app/build/rustJniLibs/${{ matrix.abi }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

      - name: Clippy for Android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t "$ABI" -P 31 clippy --locked -p wprs-android -- -D warnings

  android:
    name: Android APK
    needs: [version, android-native]
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: jni-arm64-v8a
          path: android/app/build/rustJniLibs/arm64-v8a

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: jni-x86_64
          path: android/app/build/rustJniLibs/x86_64

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
          cache-read-only: true
          add-job-summary: on-failure

      - name: Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ needs.version.outputs.semver }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          WPRS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          if [ -n "$KEYSTORE" ]; then
            base64 -d <<< "$KEYSTORE" > "$RUNNER_TEMP/wprs.keystore"
            export WPRS_KEYSTORE="$RUNNER_TEMP/wprs.keystore"
          else
            echo "::warning::ANDROID_KEYSTORE is not set, so this APK is signed with a temporary debug key"
          fi
          android/gradlew -p android assembleRelease -x :app:cargo -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Native libraries, 16 KB page alignment and no build paths
        run: |
          scripts/apk-all.sh .
          ls -l wallpaper-rs-android*.apk >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: wallpaper-rs-android.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: wallpaper-rs-android-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: wallpaper-rs-android-x86_64.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

  android-lint:
    name: Android lint and unit tests
    needs: [version, android-native]
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: jni-arm64-v8a
          path: android/app/build/rustJniLibs/arm64-v8a

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: jni-x86_64
          path: android/app/build/rustJniLibs/x86_64

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          add-job-summary: on-failure

      - name: Lint and unit tests
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ needs.version.outputs.semver }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          android/gradlew -p android lintRelease testDebugUnitTest -x :app:cargo -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

  android-emulator:
    name: Android emulator tests
    needs: version
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
          cache-read-only: true
          add-job-summary: on-failure

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile the Kotlin sources while the native library builds
        run: |
          printf 'ANDROID_NDK_HOME=%s\nANDROID_NDK_ROOT=%s\n' "$ANDROID_NDK_LATEST_HOME" "$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          android/gradlew -p android compileDebugKotlin compileDebugAndroidTestKotlin -Pabis=x86_64 -x :app:cargo

      - name: Wait for the native library
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-artifact.sh jni-x86_64 'Android native library (x86_64)'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: jni-x86_64
          path: android/app/build/rustJniLibs/x86_64

      - name: App and test APKs for x86_64
        run: android/gradlew -p android assembleDebug assembleDebugAndroidTest -Pabis=x86_64 -x :app:cargo

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          script: |
            adb shell pm disable-user --user 0 com.google.android.gms
            android/gradlew -p android connectedDebugAndroidTest -Pabis=x86_64 -x :app:cargo

      - name: Failing instrumentation tests
        if: failure()
        run: scripts/android-failures.sh

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: failure()
        with:
          name: android-tests-report
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 7

  rpm:
    name: Fedora package
    needs: [version, lint]
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      WPRS_VERSION: ${{ needs.version.outputs.informational }}
      FEDORA: docker.io/library/fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Fedora image with the build tools
        run: |
          docker run --name prepare "$FEDORA" \
            dnf -y -q install rpm-build systemd-rpm-macros gstreamer1 gstreamer1-plugins-base >/dev/null
          docker commit prepare fedora-rpm >/dev/null
          docker rm prepare >/dev/null

      - name: Wait for the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-artifact.sh wallpaper-rs-x86_64-linux Package

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist

      - name: Build and install the RPM without its desktop dependencies
        run: |
          docker run --rm -e WPRS_VERSION -v "$PWD:/src" -w /src fedora-rpm bash -c '
            set -e
            scripts/rpm.sh dist/wallpaper-rs-*.tar.gz rpm
            test "$(rpm -qp --qf "%{BUILDHOST}\n" rpm/*.rpm | sort -u)" = localhost
            own=$(rpm -qp --provides rpm/*.rpm | cut -d" " -f1)
            rpm -qpR rpm/*.rpm | grep -v "^rpmlib(" | sort -u | while read -r dep; do
              grep -qxF "${dep%% *}" <<< "$own" && continue
              dnf -q repoquery --whatprovides "$dep" | grep -q . || { echo "nothing provides $dep"; exit 1; }
            done
            rpm -i --nodeps rpm/*.rpm
            rpm -ql wallpaper-rs
            test "$(wprs-ctl --version)" = "wprs-ctl $WPRS_VERSION"
          '

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: wallpaper-rs-fedora-rpm
          path: rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: Flatpak bundle (${{ matrix.arch }})
    needs: [version, depth]
    if: needs.version.outputs.rust == 'true'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            bundle: wallpaper-rs.flatpak
          - arch: aarch64
            runner: ubuntu-24.04-arm
            bundle: wallpaper-rs-aarch64.flatpak
    runs-on: ${{ matrix.runner }}
    env:
      WPRS_VERSION: ${{ needs.version.outputs.informational }}
      BUNDLE: ${{ matrix.bundle }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tracked sources, vendored Cargo sources and version
        run: packaging/flatpak/sources.sh

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          manifest-path: packaging/flatpak/io.github.wallpaper_rs.WallpaperRs.yml
          bundle: ${{ matrix.bundle }}
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.yml') }}
          upload-artifact: false

      - name: Install and run the bundle
        run: packaging/flatpak/check.sh "$BUNDLE"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: flatpak-${{ matrix.arch }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 7

  app-check:
    name: Interface check
    needs: [version, lint]
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      ARCH: docker.io/library/archlinux:base-20261018.0.612668@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Virtual DRM devices
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci-drm.sh

      - name: Plasma image
        run: scripts/plasma-image.sh plasma-session

      - name: Wait for the app binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-artifact.sh release-bin-app 'Release binaries (app)'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-bin-app
          path: bins

      - name: Every page of the app loads
        run: |
          docker run --rm --device /dev/dri -v "$PWD:/src" -w /src plasma-session bash -c '
            set -e
            chmod +x bins/wprs-app
            bins/wprs-app --check
          '

  plasma:
    name: Plasma end-to-end
    needs: [version, lint]
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      ARCH: docker.io/library/archlinux:base-20261018.0.612668@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Virtual DRM devices
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci-drm.sh

      - name: Plasma image
        run: scripts/plasma-image.sh plasma-session

      - name: Wait for the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-artifact.sh wallpaper-rs-x86_64-linux Package

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist

      - name: Run Plasma session test
        run: |
          docker run --rm --device /dev/dri -v "$PWD:/src" -w /src plasma-session bash -c '
            set -e
            scripts/plasma-test.sh dist/wallpaper-rs-*.tar.gz plasma-test-output
          '

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: plasma-test-output
          path: plasma-test-output
          if-no-files-found: warn
          retention-days: 7

  server:
    name: Server container
    needs: version
    if: needs.version.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      WPRS_VERSION: ${{ needs.version.outputs.informational }}
      WPRS_PUBLIC_URL: http://127.0.0.1:8080
      COMPOSE_FILE: compose.yaml:deploy/compose.local.yaml
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/wprs-image
          key: server-image-${{ github.sha }}
          restore-keys: server-image-

      - name: Build the image
        env:
          WPRS_IMAGE_CACHE: ${{ runner.temp }}/wprs-image
          WPRS_IMAGE_LOAD: "1"
        run: scripts/server-image.sh wprs-server local

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: github.ref == 'refs/heads/master'
        with:
          path: ${{ runner.temp }}/wprs-image
          key: server-image-${{ github.sha }}

      - name: Start with compose
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Health, setup, repository, backup and restore
        run: scripts/server-smoke.sh

      - name: Server logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down --volumes

  release:
    name: Release
    if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [version, workflows, lint, clippy, test, render-gl, depth, e2e, sway, x11, sync, build, package, android-native, android, android-lint, android-emulator, rpm, plasma, app-check, web, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wallpaper-rs-*
          path: artifacts
          merge-multiple: true

      - name: Publish the version with an SBOM and signed checksums
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.semver }}
          SIGN: ${{ github.repository_owner == 'wallpaper-rs' }}
        run: scripts/release.sh artifacts

  image:
    name: Server image
    needs: [version, release, server]
    if: needs.release.outputs.tag != '' && github.repository_owner == 'wallpaper-rs'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      WPRS_VERSION: ${{ needs.version.outputs.informational }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/wprs-image
          key: server-image-${{ github.sha }}

      - name: Push the image with its SBOM and sign it
        env:
          WPRS_IMAGE_CACHE: ${{ runner.temp }}/wprs-image
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.semver }}
        run: |
          docker login ghcr.io --username "$ACTOR" --password-stdin <<< "$TOKEN"
          scripts/server-image.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wprs-server" "$VERSION" latest
          docker logout ghcr.io

  flatpak-release:
    name: Attach the Flatpak bundles
    needs: [version, release, flatpak]
    if: ${{ !cancelled() && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Both bundles were built
        env:
          FLATPAK: ${{ needs.flatpak.result }}
        run: test "$FLATPAK" = success

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: flatpak-*
          path: bundles
          merge-multiple: true

      - name: Attach the bundles and sign the new checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.semver }}
          SIGN: ${{ github.repository_owner == 'wallpaper-rs' }}
        run: scripts/release-flatpak.sh bundles
